name: docs

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  HOMEBREW_NO_INSTALL_CLEANUP: TRUE

jobs:
  generate:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Jazzy
        # mustache 1.1.3 breaks jazzy 0.15.4 (template_path no longer accepts a Pathname)
        run: |
          gem install mustache -v 1.1.1
          gem install --conservative jazzy
      - name: Build Docs
        run: make docs
      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
